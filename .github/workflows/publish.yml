name: Publish

# Publishes to npm on every version tag (v0.1.0, v0.2.0, ...) via npm Trusted
# Publishing (OIDC) — no stored token. Set this repo + this workflow file as
# the Trusted Publisher on the package's Settings page at npmjs.com (only
# possible after the package's first version has been published manually:
# `npm login && npm publish --access public` from a local checkout).
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
