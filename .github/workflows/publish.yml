name: Publish

# Publishes to npm on every version tag (v0.1.0, v0.2.0, ...) via npm Trusted
# Publishing (OIDC) — no stored token. Set this repo + this workflow file as
# the Trusted Publisher on the package's Settings page at npmjs.com (only
# possible after the package's first version has been published manually:
# `npm login && npm publish --access public` from a local checkout).
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # No registry-url here on purpose: setting it makes setup-node write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc.
          # With no NODE_AUTH_TOKEN secret (correct for trusted publishing),
          # that resolves to an empty token, which npm treats as "auth is
          # already configured" and skips the OIDC trusted-publisher exchange
          # entirely — the registry then 404s the unauthenticated publish
          # (it masks 403 as 404). npm publishes to the default registry
          # either way, so this option isn't needed for OIDC to work.
      - run: npm ci
      # Trusted Publishing (OIDC, no stored token) needs npm >=11.5.0; Node 22
      # only bundles npm ~10.9, which silently skips the OIDC exchange and
      # publishes unauthenticated (registry replies 404, not 401).
      - run: npm install -g npm@latest
      - run: npm run build
      - run: npm publish --access public --provenance
